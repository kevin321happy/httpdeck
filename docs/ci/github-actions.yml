name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Core tests
        run: ./gradlew :httpdeck-core:test --no-daemon
      - name: Build sample
        run: ./gradlew :sample-android:assembleDebug --no-daemon